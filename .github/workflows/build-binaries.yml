name: Build binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rdp-reverse-relay/**"
      - "rdp-reverse-agent/**"
      - "scripts/**"
      - ".github/workflows/build-binaries.yml"

permissions:
  contents: read

jobs:
  linux-relay:
    name: Linux x86_64 Relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Build Relay
        run: cargo build --manifest-path rdp-reverse-relay/Cargo.toml --release --locked
      - name: Prepare artifact
        run: |
          mkdir -p package
          install -m 0755 rdp-reverse-relay/target/release/rdp-reverse-relay package/rdp-reverse-relay-linux-x86_64
          cd package
          sha256sum rdp-reverse-relay-linux-x86_64 > SHA256SUMS
      - name: Upload Relay
        uses: actions/upload-artifact@v4
        with:
          name: rdp-reverse-relay-linux-x86_64
          path: package/
          retention-days: 14

  windows-agent:
    name: Windows x86_64 Agent
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Build Agent
        shell: pwsh
        run: cargo build --manifest-path rdp-reverse-agent/Cargo.toml --release --locked
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item rdp-reverse-agent\target\release\rdp-reverse-agent.exe package\rdp-reverse-agent-windows-x86_64.exe
          $hash = (Get-FileHash package\rdp-reverse-agent-windows-x86_64.exe -Algorithm SHA256).Hash
          "$hash  rdp-reverse-agent-windows-x86_64.exe" | Set-Content package\SHA256SUMS -Encoding ascii
      - name: Upload Agent
        uses: actions/upload-artifact@v4
        with:
          name: rdp-reverse-agent-windows-x86_64
          path: package/
          retention-days: 14
